  <text x="1060" y="606" font-size="32" text-anchor="start" font-weight="700" fill="#7e57c2" xml:space="preserve">API Realtime</text>
  <text x="1060" y="638" font-size="22" text-anchor="start" xml:space="preserve">L'API per voce e velocità</text>
  <rect x="1005" y="658" width="120" height="44" rx="10" fill="#7e57c2" fill-opacity="0.12" stroke="#7e57c2" stroke-width="2"/>
