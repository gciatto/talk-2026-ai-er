  <text x="960" y="52" font-size="40" text-anchor="middle" font-weight="700" xml:space="preserve">Il panorama delle API OpenAI</text>
  <text x="960" y="92" font-size="24" text-anchor="middle" fill="#555" xml:space="preserve">API diverse per esigenze diverse</text>
