  <text x="740" y="259" font-size="18" text-anchor="start" font-style="italic" xml:space="preserve">richiesta semplice</text>
  <text x="740" y="282" font-size="18" text-anchor="start" font-style="italic" xml:space="preserve">→ risposta testuale</text>
  <text x="70" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#2690e7" xml:space="preserve">Ideale per</text>
  <text x="510" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#2690e7" xml:space="preserve">Funzionalità principali</text>
  <text x="70" y="357" font-size="20" text-anchor="start" xml:space="preserve">• Generazione di testo semplice</text>
  <text x="70" y="385" font-size="20" text-anchor="start" xml:space="preserve">• Domande e risposte</text>
  <text x="70" y="413" font-size="20" text-anchor="start" xml:space="preserve">• Chatbot</text>
  <text x="70" y="441" font-size="20" text-anchor="start" xml:space="preserve">• Standard di settore</text>
  <text x="510" y="357" font-size="20" text-anchor="start" xml:space="preserve">• Messaggi in ingresso, testo in uscita</text>
  <text x="510" y="385" font-size="20" text-anchor="start" xml:space="preserve">• Chiamate a funzioni</text>
  <text x="510" y="413" font-size="20" text-anchor="start" xml:space="preserve">• Streaming</text>
