  <rect x="1405" y="658" width="120" height="44" rx="10" fill="#7e57c2" fill-opacity="0.12" stroke="#7e57c2" stroke-width="2"/>
  <text x="1465.0" y="686.65" font-size="19" text-anchor="middle" xml:space="preserve">Modello</text>
  <text x="1265" y="724" font-size="18" text-anchor="middle" font-style="italic" xml:space="preserve">audio, testo, eventi</text>
  <text x="1550" y="687" font-size="18" text-anchor="start" font-style="italic" xml:space="preserve">comunicazione continua,</text>
  <text x="1550" y="710" font-size="18" text-anchor="start" font-style="italic" xml:space="preserve">bidirezionale, in tempo reale</text>
  <text x="1005" y="753" font-size="22" text-anchor="start" font-weight="700" fill="#7e57c2" xml:space="preserve">Ideale per</text>
  <text x="1445" y="753" font-size="22" text-anchor="start" font-weight="700" fill="#7e57c2" xml:space="preserve">Funzionalità principali</text>
  <text x="1005" y="785" font-size="20" text-anchor="start" xml:space="preserve">• Applicazioni vocali</text>
  <text x="1005" y="813" font-size="20" text-anchor="start" xml:space="preserve">• Integrazione con la telefonia</text>
  <text x="1005" y="841" font-size="20" text-anchor="start" xml:space="preserve">• Esperienze in tempo reale</text>
  <text x="1005" y="869" font-size="20" text-anchor="start" xml:space="preserve">• Sistemi interattivi</text>
  <text x="1445" y="785" font-size="20" text-anchor="start" xml:space="preserve">• Bassa latenza</text>
  <text x="1445" y="813" font-size="20" text-anchor="start" xml:space="preserve">• Streaming bidirezionale</text>
  <text x="1445" y="841" font-size="20" text-anchor="start" xml:space="preserve">• Audio ed eventi</text>
  <rect x="995" y="896" width="865" height="44" rx="22" fill="#7e57c2" fill-opacity="0.15" stroke="#7e57c2" stroke-width="0"/>
  <rect x="995" y="896" width="150" height="44" rx="22" fill="#7e57c2" fill-opacity="1" stroke="#7e57c2" stroke-width="0"/>
  <text x="1070" y="925" font-size="20" text-anchor="middle" font-weight="700" fill="#fff" xml:space="preserve">Quando usarla</text>
  <text x="1165" y="925" font-size="20" text-anchor="start" font-weight="600" xml:space="preserve">Per interazioni in tempo reale, a bassa latenza.</text>
  <rect x="40" y="970" width="1840" height="74" rx="12" fill="#555" fill-opacity="0.06" stroke="#555" stroke-width="3"/>
  <text x="65" y="1000" font-size="21" text-anchor="start" font-weight="700" xml:space="preserve">Guida rapida:</text>
  <text x="200" y="1000" font-size="20" text-anchor="start" xml:space="preserve">Chat Completions per casi semplici; Responses per nuovi progetti che richiedono strumenti e memoria;</text>
  <text x="200" y="1030" font-size="20" text-anchor="start" xml:space="preserve">Realtime per voce e interazioni in tempo reale; evitare Assistants (dismessa nel 2026).</text>
  <text x="960" y="1070" font-size="20" text-anchor="middle" fill="#555" font-style="italic" xml:space="preserve">Le API condividono modelli, sicurezza e fatturazione: scegliere quella adatta al proprio caso d'uso.</text>

