<g font-size="20">
<text x="545" y="150">all'avvio: scoperta, cioè lettura del front matter di ogni SKILL.md</text>
<text x="545" y="197" fill="#555">nome + descrizione di ogni skill</text>
<text x="545" y="250">prompt di sistema, con il catalogo delle skill</text>
<text x="165" y="310" font-style="italic">"Valuta la domanda di Mario Rossi"</text>
<text x="545" y="337">la richiesta</text>
<text x="925" y="385" fill="#2690e7" font-family="monospace" font-size="18">load_skill("phd-application-review")</text>
<text x="935" y="427" fill="#555">corpo di SKILL.md: la procedura</text>
<text x="925" y="490" fill="#2690e7" font-family="monospace" font-size="18">run_skill_script("check_application.py", …)</text>
<text x="935" y="532" fill="#555">output JSON: documenti, lettera</text>
<text x="925" y="600" fill="#2690e7" font-family="monospace" font-size="18">read_skill_file("references/rubric.md")</text>
<text x="935" y="642" fill="#555">la griglia della commissione</text>
<text x="545" y="710" fill="#555">il rapporto, seguendo assets/report-template.md</text>
<text x="165" y="770" fill="#555">il rapporto</text>
</g>
<text x="1160" y="805" font-size="18" font-style="italic" fill="#2690e7" text-anchor="middle">frecce blu: chiamate ai tool, eseguite dal controllore</text>
</svg>
